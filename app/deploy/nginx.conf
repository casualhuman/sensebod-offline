# Sensebod on the Raspberry Pi: example nginx site.
#
#   sudo apt install nginx-light
#   sudo cp deploy/security-headers.conf /etc/nginx/snippets/sensebod-offline-security-headers.conf
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sensebod-offline
#   sudo ln -sf ../sites-available/sensebod-offline /etc/nginx/sites-enabled/sensebod-offline
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Layout on the Pi (see docs/ARCHITECTURE.md, "Deploying to the Pi"):
#   /var/www/sensebod-offline/releases/<build-id>/   one folder per build (contents of app/dist)
#   /var/www/sensebod-offline/current                symlink to the live release
#   /var/lib/sensebod-offline/media/                 videos, audio, pictures, animation packages (owned by the backend)
#   127.0.0.1:8000                           the backend API (not built yet)
#
# This file is a server block: it belongs inside the http { } block that
# /etc/nginx/nginx.conf already provides (sendfile, mime.types, worker settings).
#
# The CSP in the security-headers snippet contains
#   'sha256-tQjf8gvb2ROOMapIxFvFAYBeUJ0v1HCbOcSmDNXGtDo='
# for the inline loader line of index.html; "npm run build" fails if that ever changes.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                       # answers on any name or IP the bag's Wi-Fi hands out

    root /var/www/sensebod-offline/current;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/vtt;

    # Make sure these are known whatever the distribution's mime.types says.
    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js;
        application/json          json;
        image/svg+xml             svg;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/webp                webp;
        font/woff2                woff2;
        text/vtt                  vtt;
        video/mp4                 mp4 m4v;
        audio/mp4                 m4a;
        audio/mpeg                mp3;
        application/pdf           pdf;
    }
    default_type application/octet-stream;

    # ---- compression ----
    # The build ships .gz files next to every text asset: nginx sends those
    # as they are (no CPU spent). "gzip on" only covers API JSON.
    gzip_static on;
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types application/json text/vtt;
    # Brotli is not configured: browsers only accept it over HTTPS, and the bag is plain HTTP.

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    # ---- content-hashed build output: cache for a year, never revalidate ----
    location /assets/ {
        include snippets/sensebod-offline-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;            # a missing chunk is a 404, never index.html
    }

    # ---- illustrations: requested with ?v=<hash of the folder>, so also immutable ----
    location /illustrations/ {
        include snippets/sensebod-offline-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- unhashed static files: logos, portal pictures, favicon. Cheap 304 revalidation. ----
    location ~ ^/(brand|pictures)/|^/favicon\.png$ {
        include snippets/sensebod-offline-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ---- API: the backend on the same Pi ----
    location /api/ {
        include snippets/sensebod-offline-security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        # Uploads (videos) go straight through to the backend, not into a temp file first.
        client_max_body_size 2g;
        proxy_request_buffering off;
        # If the backend is down or restarting, answer in the API's own error shape.
        proxy_intercept_errors off;
        error_page 502 503 504 = @api_down;
    }
    location @api_down {
        include snippets/sensebod-offline-security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 503 '{"error":{"code":"unavailable","message":"The bag is starting. Please try again in a moment."}}';
    }

    # ---- media: large local files, streamed with byte ranges ----
    # nginx answers Range requests for static files by itself (206 Partial
    # Content, Accept-Ranges: bytes), so seeking works and a phone never has
    # to download a whole video.
    location /media/ {
        alias /var/lib/sensebod-offline/media/;
        include snippets/sensebod-offline-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        gzip off;                        # media is already compressed
        gzip_static off;
        # Keep one phone from taking the whole Wi-Fi when a class watches together:
        # full speed for the first 2 MB (fast start), then about 1.5 Mbit/s per connection.
        limit_rate_after 2m;
        limit_rate 190k;
        try_files $uri =404;
    }

    # ---- animation packages: other people's HTML, kept in a box ----
    # Shown in a sandboxed <iframe>. This CSP lets the package use its own
    # inline scripts and styles but not reach anything outside itself.
    location /media/tryit/ {
        alias /var/lib/sensebod-offline/media/tryit/;
        add_header Content-Security-Policy "sandbox allow-scripts; default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    # ---- the application shell ----
    # Never cached without asking: after an update every phone gets the new
    # index.html, which points at the new hashed files.
    location = /index.html {
        include snippets/sensebod-offline-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---- single-page app fallback: any other path is a screen inside the app ----
    # Direct links and refresh work on /portal/…, /lesson/…, /admin/….
    location / {
        include snippets/sensebod-offline-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
