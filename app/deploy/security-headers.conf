# Sensebod security headers. Included by nginx.conf in every location,
# because an add_header inside a location replaces the ones set above it.
#
# Content-Security-Policy, one source list per line of reasoning:
#   default-src 'self'            everything comes from the bag itself
#   script-src  'self' 'sha256-…' the built scripts, plus the one inline loader
#                                 line in index.html (hash checked on every build
#                                 by scripts/postbuild.mjs)
#   style-src   'self' 'unsafe-inline'
#                                 the build delivers CSS inside the script chunks
#                                 and adds it with a <style> element (see
#                                 docs/ARCHITECTURE.md, "Browser target")
#   img-src / media-src blob:     previews of photos and recordings an admin
#                                 has just chosen, before upload
#   frame-src 'self'              Try it animation packages, served from /media/
#   connect-src 'self'            the API only; nothing can call out
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-tQjf8gvb2ROOMapIxFvFAYBeUJ0v1HCbOcSmDNXGtDo='; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
# Camera and microphone only for the bag's own pages (admin: photos of notes,
# voice recording). Everything else off.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
