<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Chess AI</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta
          name="description"
          content="A simple chess AI.">

        <!-- Sensebod Offline: everything is in this folder. Nothing comes from the internet. -->

        <!-- Chessboard JS 1.0.0 -->
        <link rel="stylesheet" href="css/chessboard-1.0.0.min.css">

        <!-- Sensebod Offline layout (replaces Bootstrap) -->
        <link rel="stylesheet" href="css/main.css">
    </head>
    <body>
        <main id="app">
            <div id="status" role="status" aria-live="polite">Loading&hellip;</div>
            <div id="myBoard"></div>
            <div id="controls">
                <button type="button" id="newBtn">New game</button>
                <button type="button" id="undoBtn" disabled>Undo</button>
                <button type="button" id="levelBtn"><small>Level</small><span id="levelName">Easy</span></button>
            </div>
            <div id="credit">Chess AI &copy; 2020 Zhang Zeyu &middot; MIT licence</div>
        </main>

        <!-- Sensebod Offline: storage stand-ins, before every other script -->
        <script src="sensebod-offline-shim.js"></script>
        <!-- jQuery 3.5.1 -->
        <script src="js/jquery-3.5.1.min.js"></script>
        <!-- Chessboard JS 1.0.0 -->
        <script src="js/chessboard-1.0.0.min.js"></script>
        <!-- Chess JS (slightly modified by the Chess AI project) -->
        <script src="js/chess.js"></script>
        <!-- Piece pictures drawn for Sensebod Offline -->
        <script src="js/pieces.js"></script>
        <!-- Custom JS -->
        <script src="js/main.js"></script>
    </body>
</html>
