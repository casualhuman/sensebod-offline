<!doctype html>
<html lang="en">

<head>
  <!--

  JavaScript Snake
  By Patrick Gillespie (patorjk.com), MIT licence: see the LICENSE file.
  Dos styling: TuiCss by Vinicius Reif Biavatti, MIT licence: see css/tuicss/LICENSE.md.

  This page was modified for Sensebod Offline on 2026-11-16 (no internet,
  sandboxed frame, Chrome 58, touch on a 320px phone).
  See SENSEBOD-OFFLINE-CHANGES.txt for the project address and the list of changes.

  -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JavaScript Snake</title>
  <link rel="stylesheet" type="text/css" href="css/tuicss/tuicss.min.css" />
  <link rel="stylesheet" type="text/css" href="css/common-snake.css" />
  <link rel="stylesheet" type="text/css" href="css/dos-snake.css" />
  <link rel="stylesheet" id="style" type="text/css" href="css/main-snake.css" />
  <style>
    /* ---- Sensebod Offline: fit a small frame, play by touch ---- */

    /* the board is sized to the frame; nothing may scroll */
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      touch-action: manipulation; /* no double-tap zoom during play */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* swipes on the board must not pan or zoom the page */
    .snake-playing-field,
    .snake-snakebody-block,
    .snake-food-block,
    .snake-panel-component,
    .snake-gamepad,
    .snake-pause-button {
      touch-action: none;
    }

    /* the block pictures are 20px; blocks are 16px on a small screen */
    .snake-snakebody-block {
      background-size: 100% 100%;
    }

    /* dialogs: centred in the frame (not in the board), never wider than it */
    .snake-welcome-dialog.tui-window,
    .snake-try-again-dialog.tui-window,
    .snake-win-dialog.tui-window,
    .snake-pause-screen.tui-window {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 290px;
      max-width: 94%;
      max-height: 96%;
      overflow-y: auto;
      padding: 12px;
      box-shadow: 4px 4px #000;
    }

    .snake-dos-alert.tui-window {
      min-width: 0;
      width: 290px;
      max-width: 94%;
      box-shadow: 4px 4px #000;
    }

    .snake-credit {
      font-size: 12px;
    }

    /* buttons and the drop-down list: large enough for a finger */
    #game-area .tui-button,
    .snake-dos-alert .tui-button {
      min-width: 140px;
      min-height: 48px;
      padding: 8px 16px;
      box-shadow: 4px 4px #000;
    }

    .snake-dialog-controls {
      margin-top: 16px;
    }

    .snake-dialog-controls select {
      min-height: 44px;
    }

    /* score labels: small enough to stand beside the arrow buttons at 320px */
    @media (max-width: 479px) {
      body .snake-panel-component {
        font-size: 14px;
      }
    }

    body .snake-panel-component {
      padding-top: 2px;
      padding-bottom: 2px;
      white-space: nowrap;
    }

    /* on-screen controls, always shown: arrows bottom right, pause bottom left */
    .snake-gamepad {
      position: fixed;
      right: 10px;
      bottom: 10px;
      display: grid;
      grid-template-columns: 52px 52px 52px;
      grid-template-rows: 52px 52px;
      grid-gap: 6px;
    }

    .snake-gamepad button,
    .snake-pause-button {
      width: 52px;
      height: 52px;
      margin: 0;
      padding: 0;
      color: #333;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid #666;
      border-radius: 10px;
      outline: 0;
    }

    .snake-gamepad button:active,
    .snake-pause-button:active {
      background: rgba(180, 180, 180, 0.9);
    }

    .snake-gamepad svg,
    .snake-pause-button svg {
      display: block;
      width: 26px;
      height: 26px;
      margin: 0 auto;
      fill: #222;
      pointer-events: none;
    }

    .snake-pause-button {
      position: fixed;
      left: 10px;
      bottom: 10px;
    }
  </style>
  <!-- Sensebod Offline: in-memory stand-in for storage, before every other script -->
  <script src="sensebod-offline-shim.js"></script>
</head>
  <body>
    <!-- SNAKE.Board puts this into whichever dialog is shown.
         It is passed to the board via the dialogControls config option. -->
    <div class="snake-dialog-controls" id="snake-dialog-controls">
      <div class="snake-control-row">
        <label for="selectMode">Mode:</label>
        <select id="selectMode" class="tui-input">
          <option value="100">Easy</option>
          <option value="75" selected>Medium</option>
          <option value="50">Hard</option>
          <option value="25">Impossible</option>
          <option value="110">Rush</option>
        </select>
      </div>
    </div>

  <div id="mode-wrapper" style="display: inline; width: auto"></div>

  <div id="game-area" tabindex="0"></div>

  <!-- On-screen controls (wired up in js/init.js). data-key is the key code. -->
  <div class="snake-gamepad" id="snake-gamepad">
    <button type="button" data-key="38" style="grid-row: 1; grid-column: 2" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M12 4 L22 20 L2 20 Z" /></svg></button>
    <button type="button" data-key="37" style="grid-row: 2; grid-column: 1" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M4 12 L20 2 L20 22 Z" /></svg></button>
    <button type="button" data-key="40" style="grid-row: 2; grid-column: 2" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M12 20 L22 4 L2 4 Z" /></svg></button>
    <button type="button" data-key="39" style="grid-row: 2; grid-column: 3" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M20 12 L4 2 L4 22 Z" /></svg></button>
  </div>
  <button type="button" class="snake-pause-button" id="snake-pause" data-key="32" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M5 3 H10 V21 H5 Z M14 3 H19 V21 H14 Z" /></svg></button>

  <script type="text/javascript" src="js/snake.js"></script>
  <script type="text/javascript" src="js/init.js"></script>
</body>

</html>
