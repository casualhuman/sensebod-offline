<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tower Blocks</title>
<style>
*{margin:0;padding:0}
img{width:100%}
html{background:#fff;height:100%;overflow:hidden}
body{font-family:"Helvetica Neue",Arial,Helvetica,sans-serif;margin:0 auto;text-align:center;width:100%;height:100%;overflow:hidden;background:#f95240 url(assets/main-bg.png);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media screen and (min-height:560px){html{font-size:100px}}
@media screen and (min-height:640px){html{font-size:112.5px}}
@media screen and (min-height:720px){html{font-size:125px}}
@media screen and (min-height:800px){html{font-size:137.5px}}
@media screen and (min-height:880px){html{font-size:150px}}
@media screen and (min-height:960px){html{font-size:162.5px}}
@media screen and (min-height:1040px){html{font-size:180px}}
@media screen and (min-height:1200px){html{font-size:200px}}
html{font-size:17.6vh}
#canvas{position:fixed;left:0;top:0;right:0;bottom:0;margin:auto}
.hide{display:none}
.loading{background-color:#f05a50;height:100%;width:100%}
.loading .main{width:60%;margin:0 auto;color:#fff}
.loading .main img{width:60%;margin:1rem auto 0}
.loading .main .title{font-size:.3rem}
.loading .main .text{font-size:.15rem}
.loading .main .bar{height:.12rem;width:100%;border:3px solid #fff;border-radius:.6rem;margin:.1rem 0}
.loading .main .bar .sub{height:.1rem;width:98%;margin:.008rem auto 0}
.loading .main .bar .percent{height:100%;width:0;background-color:#fff;border-radius:.6rem}
.content{height:100vh;margin:0 auto;position:relative}
.landing .action-1{padding-top:.9rem}
.landing .title{display:inline-block;font-size:.5rem;line-height:1.05;font-weight:bold;color:#ffd23c;text-shadow:-3px -3px 0 #7a3a12,3px -3px 0 #7a3a12,-3px 3px 0 #7a3a12,3px 3px 0 #7a3a12,0 6px 0 #7a3a12}
.landing .how{margin-top:.25rem;font-size:.2rem;font-weight:bold;color:#fff;text-shadow:0 1px 2px #333}
.landing .action-2{position:absolute;bottom:.2rem;width:100%}
.landing .start{width:60%;cursor:pointer}
.slideTop{-webkit-animation:st 1s ease-in-out;animation:st 1s ease-in-out}
@-webkit-keyframes st{0%{transform:translateZ(0)}100%{transform:translate3d(0,-100%,0)}}
@keyframes st{0%{transform:translateZ(0)}100%{transform:translate3d(0,-100%,0)}}
.slideBottom{-webkit-animation:sb 1s ease-in-out;animation:sb 1s ease-in-out}
@-webkit-keyframes sb{0%{transform:translateZ(0)}100%{transform:translate3d(0,200%,0)}}
@keyframes sb{0%{transform:translateZ(0)}100%{transform:translate3d(0,200%,0)}}
.swing{-webkit-animation:sw 2s ease-in-out alternate infinite;animation:sw 2s ease-in-out alternate infinite}
@-webkit-keyframes sw{0%{transform:rotate(5deg);transform-origin:top center}100%{transform:rotate(-5deg);transform-origin:top center}}
@keyframes sw{0%{transform:rotate(5deg);transform-origin:top center}100%{transform:rotate(-5deg);transform-origin:top center}}
.modal .mask{background-color:#000;opacity:.6;position:fixed;height:100%;width:100%;top:0;left:0}
.modal .modal-content{position:fixed;height:100%;width:90%;margin-top:.3rem;top:0}
.modal .main{width:85%;margin:0 auto}
.modal .container{position:relative}
.modal .bg{width:100%;position:absolute;top:0;left:0}
.modal .modal-main{width:100%;position:absolute;top:0;left:0;margin-top:-.4rem}
.modal .over-img{width:80%;margin:.8rem auto 0}
.modal .over-score{margin-top:-.2rem;font-size:.5rem;font-weight:bold;color:#ff735c;text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff}
.modal .tip{font-size:.16rem;color:#9b724e}
.modal .over-button-b{width:70%;margin:.1rem auto 0;cursor:pointer}
/* Sensebod Offline: sound on / off button */
#sound{position:absolute;left:2px;bottom:2px;z-index:5;min-width:48px;height:48px;padding:0 4px;border:2px solid #fff;border-radius:8px;background:rgba(0,0,0,.45);color:#fff;font:bold 12px/1.2 Arial,Helvetica,sans-serif}
</style>
</head>
<body>
<canvas id="canvas" class="hide"></canvas>
<div class="content">
  <div class="loading">
    <div class="main">
      <img src="./assets/main-loading.gif" alt="">
      <div class="progress">
        <div class="title">0%</div>
        <div class="bar"><div class="sub"><div class="percent"></div></div></div>
        <div class="text">Loading...</div>
      </div>
    </div>
  </div>
  <div class="landing hide">
    <div class="action-1">
      <div class="title swing">Tower<br>Blocks</div>
      <p class="how">Tap to drop each block.<br>Build the tower high!</p>
    </div>
    <div class="action-2"><img id="start" src="./assets/main-index-start.png" class="start" alt="Start"></div>
  </div>
  <div id="modal" class="modal hide">
    <div class="mask"></div>
    <div class="js-modal-content modal-content">
      <div class="main">
        <div class="container">
          <img src="./assets/main-modal-bg.png" class="bg" alt="">
          <div class="modal-main">
            <div id="over-modal" class="hide js-modal-card">
              <img src="./assets/main-modal-over.png" class="over-img" alt="Game over. Score">
              <div id="score" class="over-score"></div>
              <div id="over-zero" class="hide">
                <div class="tip">
                  <p>Try Again!</p>
                  <img src="./assets/main-modal-again-b.png" class="over-button-b js-reload" alt="Replay">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <button id="sound" type="button" class="hide">Sound<br>on</button>
</div>
<script src="./sensebod-offline-shim.js"></script>
<script src="./dist/main.js"></script>
<script src="./assets/zepto-1.1.6.min.js"></script>
<script>
// Sensebod Offline: a sandboxed frame can be 0 x 0 for a moment while it loads. The game measures the
// frame once, so it waits here until the frame has a size (otherwise the canvas is empty: no Start button).
(function boot() {
  if (!(window.innerWidth > 0 && window.innerHeight > 0)) { setTimeout(boot, 50); return }
  var domReady, loadFinish, canvasReady, loadError, gameStart, gameOver, game, score, successCount
  // init window height and width
  var gameWidth = window.innerWidth
  var gameHeight = window.innerHeight
  var ratio = 1.5
  if (gameHeight / gameWidth < ratio) {
    gameWidth = Math.ceil(gameHeight / ratio)
  }
  $('.content').css({ "height": gameHeight + "px", "width": gameWidth + "px" })
  $('.js-modal-content').css({ "width": gameWidth + "px" })

  // loading animation
  function hideLoading() {
    if (domReady && canvasReady) {
      $('#canvas').show()
      loadFinish = true
      setTimeout(function () {
        $('.loading').hide()
        $('.landing').show()
        $('#sound').show()
      }, 1000)
    }
  }

  function updateLoading(status) {
    var success = status.success
    var total = status.total
    var failed = status.failed
    if (failed > 0 && !loadError) {
      loadError = true
      // Sensebod Offline: no alert() in a sandboxed frame; say it on the page.
      $('.loading .text').text('Some files did not load. Close the game and open it again.')
      return
    }
    var percent = parseInt((success / total) * 100);
    if (percent === 100 && !canvasReady) {
      canvasReady = true
      hideLoading()
    }
    percent = percent > 98 ? 98 : percent
    percent = percent + '%'
    $('.loading .title').text(percent);
    $('.loading .percent').css({
      'width': percent
    })
  }

  function overShowOver() {
    gameOver = true
    $('#modal').show()
    $('#over-modal').show()
    $('#over-zero').show()
  }

  // game customization options
  var option = {
    width: gameWidth,
    height: gameHeight,
    canvasId: 'canvas',
    soundOn: true,
    setGameScore: function (s) {
      score = s
    },
    setGameSuccess: function (s) {
      successCount = s
    },
    setGameFailed: function (f) {
      $('#score').text(score || 0)
      if (f >= 3) overShowOver()
    }
  }

  // game init with option (Sensebod Offline: music waits for the Start tap)
  game = TowerGame(option)
  game.load(function () {
    game.init()
  }, updateLoading)

  function indexHide() {
    $('.landing .action-1').addClass('slideTop')
    $('.landing .action-2').addClass('slideBottom')
    setTimeout(function () {
      $('.landing').hide()
    }, 950)
  }

  function startGame() {
    if (gameStart || !loadFinish) return
    gameStart = true
    setTimeout(function () {
      playBgmSafe()
    })
    indexHide()
    setTimeout(game.start, 400)
  }

  function reloadGame() {
    window.location.reload()
  }

  // Sensebod Offline: play() gives back a promise on newer browsers; a refusal must not show as an error.
  function playBgmSafe() {
    try {
      var bgm = game.getAudio('bgm')
      if (!bgm) return
      if (!bgm.sensebodLoop) {
        bgm.sensebodLoop = true
        bgm.loop = true
      }
      var p = bgm.play()
      if (p && p['catch']) p['catch'](function () {})
    } catch (e) {}
  }

  // click event
  $('#start').on('click', startGame)
  $('.js-reload').on('click', reloadGame)

  // Sensebod Offline: sound on / off
  var muted = false
  function setMuted(m) {
    muted = m
    var all = (game.assetsObj && game.assetsObj.audio) || {}
    for (var name in all) {
      if (Object.prototype.hasOwnProperty.call(all, name)) all[name].muted = m
    }
    document.getElementById('sound').innerHTML = m ? 'Sound<br>off' : 'Sound<br>on'
  }
  var soundButton = document.getElementById('sound')
  // keep a tap on this button from also dropping a block (the game listens on document)
  function stopHere(e) { e.stopPropagation() }
  soundButton.addEventListener('touchstart', stopHere, false)
  soundButton.addEventListener('mousedown', stopHere, false)
  soundButton.addEventListener('keydown', stopHere, false)
  soundButton.addEventListener('click', function () {
    setMuted(!muted)
    soundButton.blur()
  }, false)

  // Sensebod Offline: keyboard. Space or Enter = Start, drop a block, play again.
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode
    if (k !== 32 && k !== 13) return
    e.preventDefault()
    if (e.repeat) return
    if (gameOver) {
      if (k === 13) reloadGame()
      return
    }
    if (!gameStart) {
      startGame()
      return
    }
    game.touchStartListener()
  }, false)

  // listener
  window.addEventListener('load', function () {
    domReady = true
    hideLoading()
  }, false);
  // the page may already be loaded when the wait above ends
  if (document.readyState === 'complete') { domReady = true; hideLoading() }
})()
</script>
</body>
</html>
