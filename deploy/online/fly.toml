# Fly.io, online test server. From the repository root:
#   fly launch --no-deploy --copy-config --config deploy/online/fly.toml   (choose your own app name)
#   fly volumes create sensebod_data --size 3 --config deploy/online/fly.toml
#   fly secrets set SENSEBOD_ADMIN_PASSWORD='…' --config deploy/online/fly.toml
#   fly deploy . --config deploy/online/fly.toml --dockerfile deploy/online/Dockerfile
# Guide: docs/DEPLOY-ONLINE-DEMO.md
app = "sensebod-offline-test"
primary_region = "lhr"

[env]
  SENSEBOD_DEPLOY = "online"
  SENSEBOD_PUBLIC_HOST = "sensebod-offline-test.fly.dev"
  SENSEBOD_ADMIN_USERNAME = "admin"

[[mounts]]
  source = "sensebod_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine only: SQLite lives on its volume. Stop when idle to save money.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
