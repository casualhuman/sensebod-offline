openapi: 3.0.3
info:
  title: Sensebod Offline edge API
  version: 0.5.1
  description: |
    The confirmed contract between the Sensebod Offline frontend and the backend on the Raspberry Pi
    ("DLH in a bag"). Proposed by the System Architecture Agent on 12 Nov 2026, revised 13 Nov 2026
    (revision 1, answers verification round 1) and again (revision 2, answers verification round 2), **awaiting reverification**. Item-by-item decisions against the frontend's proposal
    (`docs/API-CONTRACT.md`) are in `docs/system/API-DECISIONS.md`. Field names follow
    `app/src/shared/api/types.ts` exactly.
    The contract is independent of the backend runtime (the owner's choice is Node.js with Express, OWNER-1).

    Rules for every endpoint:
    - Same origin as the app, plain HTTP, JSON UTF-8. URLs in answers are root-relative.
    - `null` means "not known"; the server never invents values.
    - Every non-GET request must carry `X-Sensebod-Offline-Client: 1` (CSRF defence); otherwise `403 csrf`.
    - Create-type POSTs carry `Idempotency-Key`; keys are kept 24 h, scoped by actor + method + path.
      Same key with a different body → `422 idempotency_mismatch`; same key while the first request
      is still running → `409 in_progress` with `Retry-After`.
    - Content answers send `ETag` and `Cache-Control: no-cache` and honour `If-None-Match` (304).
      Everything under `/learners` and `/admin` is `Cache-Control: no-store`.
    - Rate limits (nginx, per client IP): sign-in 5/min, `POST /learners` 30/min, Child protection activity 10/min, everything else 20 req/s
      (burst 40). Over the limit → `429 rate_limited` with `Retry-After`.
    - Offline: no endpoint depends on the internet. While the backend is down or in maintenance,
      nginx answers `503` in the error shape below.
    - Performance figures in descriptions are targets on a Raspberry Pi 5 with 40 phones, **unverified**.
servers:
  - url: /api/v1
tags:
  - name: health
  - name: learner-content
  - name: learner-progress
  - name: admin-session
  - name: admin-content
  - name: admin-uploads
  - name: admin-exports
  - name: admin-usb
  - name: admin-system

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Is the backend up?
      x-auth: none
      description: Used by nginx, the frontend reach check and monitoring. p95 < 50 ms (target, unverified).
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Starting or in maintenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  # ------------------------------------------------------------------ learner content
  /portals:
    get:
      tags: [learner-content]
      operationId: getPortals
      summary: The five portals in Home order
      x-auth: none
      description: Cacheable (ETag from the bag's content revision). p95 < 150 ms (target, unverified).
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Portals
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Portal' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /portals/{portalId}:
    get:
      tags: [learner-content]
      operationId: getPortal
      summary: A portal with its groups
      x-auth: none
      description: Only groups and counts of published, placed lessons. p95 < 200 ms (target, unverified).
      parameters:
        - $ref: '#/components/parameters/PortalIdPath'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Portal detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalDetail' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /groups/{groupId}:
    get:
      tags: [learner-content]
      operationId: getGroup
      summary: A group (class, audience or topic) with its series
      x-auth: none
      parameters:
        - $ref: '#/components/parameters/GroupIdPath'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Group detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /series/{seriesId}:
    get:
      tags: [learner-content]
      operationId: getSeries
      summary: A series with its published lessons in learner order (quiz last)
      x-auth: none
      parameters:
        - $ref: '#/components/parameters/SeriesIdPath'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Series detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesDetail' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /lessons/{lessonId}:
    get:
      tags: [learner-content]
      operationId: getLesson
      summary: One published lesson with its content
      x-auth: none
      description: |
        Quiz answers (`correct`, `feedback`) are sent on purpose so quizzes keep working if the Wi-Fi drops.
        Media URLs point to `/media/…`, served by nginx with byte ranges. p95 < 200 ms (target, unverified).
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Lesson
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  # ------------------------------------------------------------------ learner progress
  /learners:
    post:
      tags: [learner-progress]
      operationId: createLearner
      summary: Save my progress — create a learner (name + who you are + a 4-digit secret number)
      x-auth: none
      description: |
        Owner decision 2026-11-16 (replaces "no PIN"): the learner chooses a 4-digit secret number, so
        two learners with the same name are told apart and a learner can sign in again on another phone.
        Name (capitals ignored) + number must identify one learner: `409 pin_taken` with `fields.pin` otherwise.
        The number is stored hashed and is never returned or exported.
        The id is 128-bit random and unguessable. Idempotent by `Idempotency-Key`
        (a retry after a Wi-Fi drop returns the first learner). Rate limit 30/min per IP.
        There is deliberately no `GET /learners`.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewLearner' }
      responses:
        '201':
          description: Created (or the first result of the same key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Learner' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/StorageFull' }
  /learners/sign-in:
    post:
      tags: [learner-progress]
      operationId: signInLearner
      summary: I have a name already — find my learner by name and secret number
      x-auth: none
      description: |
        Returns the learner whose name (capitals ignored) and 4-digit number match. A wrong name and a
        wrong number give the same `401 wrong_name_or_number`. After 5 wrong tries for one name, that
        name answers `429 too_many_tries` for 5 minutes (counted in memory only; a name is never written
        outside the learner table). Creates nothing, so it takes no `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearnerSignIn' }
      responses:
        '200':
          description: The learner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Learner' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /learners/{learnerId}:
    get:
      tags: [learner-progress]
      operationId: getLearner
      summary: One learner
      x-auth: none
      parameters:
        - $ref: '#/components/parameters/LearnerIdPath'
      responses:
        '200':
          description: Learner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Learner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [learner-progress]
      operationId: deleteLearner
      summary: Remove a learner and their progress
      x-auth: none
      description: |
        Idempotent: 204 when the learner existed or was already removed (a tombstone exists); 404 if the id
        never existed on this bag. Leaves a tombstone with the id only. The name is overwritten in the
        database pages (secure_delete for this transaction); copies in snapshots expire within 30 days.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/LearnerIdPath'
      responses:
        '204': { description: Removed (or already removed) }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /learners/{learnerId}/progress:
    get:
      tags: [learner-progress]
      operationId: getProgress
      summary: Lessons this learner started or finished
      x-auth: none
      description: Never contains lessons of a sensitive (Child protection) portal while the bag records counts only.
      parameters:
        - $ref: '#/components/parameters/LearnerIdPath'
        - name: portalId
          in: query
          schema: { $ref: '#/components/schemas/PortalId' }
        - name: seriesId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerProgress' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /learners/{learnerId}/progress/{lessonId}:
    put:
      tags: [learner-progress]
      operationId: saveLessonProgress
      summary: Save progress on one lesson
      x-auth: none
      description: |
        Idempotent PUT. Monotonic: `finished` is never downgraded. Position-only updates within 10 s of the
        stored position and less than 60 s after the last write may be coalesced (the stored row is returned
        without a write). **Never used for Child protection:** for a lesson in a sensitive portal (counts-only
        mode, the default) the answer is 409 `sensitive_lesson` and nothing is written; the client uses
        `POST /lessons/{lessonId}/activity` instead, which carries no learner id.
        Durable (`synchronous=FULL`) before 200. p95 < 300 ms (target, unverified).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/LearnerIdPath'
        - $ref: '#/components/parameters/LessonIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressUpdate' }
      responses:
        '200':
          description: Stored progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonProgress' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/StorageFull' }
  /lessons/{lessonId}/activity:
    post:
      tags: [learner-progress]
      operationId: recordSensitiveActivity
      summary: Count an anonymous view or finish of a Child protection lesson
      x-auth: none
      description: |
        For lessons in a sensitive (Child protection) portal only (409 `not_sensitive` otherwise). Carries
        **no learner id** and works for guests and saved learners alike. `viewId` is 128 random bits made by
        the page once per page view (`crypto.getRandomValues`, available on plain HTTP). The bag counts each
        (viewId, lesson, event) once per day, so pauses, retries and a repeated "finished" are no-ops.
        Logged as a route template only, without IP. Stored in a separate database file with no sequence number or
        time of day, so it cannot be ordered against personal data. Rate limit 10/min per IP; the counts are
        page views on the bag and indicative only. p95 < 200 ms (target, unverified).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/LessonIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitiveActivity' }
      responses:
        '204': { description: Counted (or already counted for this view) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /learners/{learnerId}/continue:
    get:
      tags: [learner-progress]
      operationId: getContinueLesson
      summary: The lesson for "Continue where you stopped", or null
      x-auth: none
      parameters:
        - $ref: '#/components/parameters/LearnerIdPath'
        - name: portalId
          in: query
          schema: { $ref: '#/components/schemas/PortalId' }
      responses:
        '200':
          description: Lesson to continue, or null
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ContinueLesson' }]
                nullable: true
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  # ------------------------------------------------------------------ admin session
  /admin/session:
    post:
      tags: [admin-session]
      operationId: signIn
      summary: Sign in
      x-auth: none
      description: |
        Sets cookie `sb_admin` (HttpOnly, SameSite=Strict, Path=/, no Secure flag: plain HTTP).
        Sessions: idle 2 h, absolute 12 h, and every session ends when the bag restarts (the clock may have
        jumped). After 5 failures for a username: locked 1 min, doubling to
        15 min max (`429`). Rate limit 5/min per IP. Password hashes use a memory-hard KDF (Argon2id or scrypt).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCredentials' }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema: { type: string }
              description: sb_admin=<token>; HttpOnly; SameSite=Strict; Path=/
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [admin-session]
      operationId: getSession
      summary: The current admin session
      x-auth: admin
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorised' }
    delete:
      tags: [admin-session]
      operationId: signOut
      summary: Sign out
      x-auth: admin
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204': { description: Signed out; cookie cleared }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/session/confirm:
    post:
      tags: [admin-session]
      operationId: confirmPassword
      summary: Type the password again (re-authentication, valid 5 minutes)
      x-auth: admin
      description: Needed before exports with names and before account changes.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1 }
      responses:
        '204': { description: Confirmed }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/session/password:
    post:
      tags: [admin-session]
      operationId: changePassword
      summary: Change my password
      x-auth: admin
      description: |
        Ends every other session of this account. `currentPassword` is required, except in the restricted
        session created by an override code (`/admin/override/redeem`), whose only allowed action is this one.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '204': { description: Changed }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ------------------------------------------------------------------ admin content
  /admin/lessons:
    get:
      tags: [admin-content]
      operationId: getLibrary
      summary: Library (every lesson, drafts included)
      x-auth: admin
      description: Ordered by portal, group, series, position. `unplaced=true` ignores other filters.
      security: [{ adminCookie: [] }]
      parameters:
        - { name: portalId, in: query, schema: { $ref: '#/components/schemas/PortalId' } }
        - { name: groupId, in: query, schema: { type: string } }
        - { name: seriesId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/LessonType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PublishStatus' } }
        - { name: unplaced, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Library page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryPage' }
        '401': { $ref: '#/components/responses/Unauthorised' }
    post:
      tags: [admin-content]
      operationId: createLesson
      summary: Create a draft lesson (placement null)
      x-auth: admin
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewLesson' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLesson' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '507': { $ref: '#/components/responses/StorageFull' }
  /admin/lessons/{lessonId}:
    get:
      tags: [admin-content]
      operationId: getAdminLesson
      summary: One lesson for admins
      x-auth: admin
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
      responses:
        '200':
          description: Lesson
          headers:
            ETag:
              schema: { type: string }
              description: '"v<version>"'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLesson' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin-content]
      operationId: updateLesson
      summary: Change title, summary, placement, picture, type override, blocks or transcript
      x-auth: admin
      description: |
        Placement inserts at `position` and renumbers the lessons after it in one transaction; the quiz stays
        last. Optional `If-Match: "v<version>"`; a mismatch answers 412 and changes nothing.
        Lessons with `source: content-pack`: only `placement`, `pictureId` (and publish state through its own
        endpoints) may change; any other field answers 409 `pack_owned`. Placing a lesson into a sensitive
        (Child protection) portal deletes learners' saved progress on it in the same transaction.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/LessonIdPath'
        - name: If-Match
          in: header
          schema: { type: string, example: '"v3"' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLesson' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [admin-content]
      operationId: deleteLesson
      summary: Delete a lesson (the lessons after it are renumbered)
      x-auth: admin
      description: Idempotent. Progress on the lesson is deleted with it. Files are garbage-collected after 24 h.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/LessonIdPath'
      responses:
        '204': { description: Deleted (or already gone) }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/lessons/{lessonId}/publish:
    post:
      tags: [admin-content]
      operationId: publishLesson
      summary: Publish (learners see it on their next request)
      x-auth: admin
      description: Idempotent (publishing a published lesson returns it). 409 `not_placed` without placement.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/LessonIdPath'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLesson' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/lessons/{lessonId}/unpublish:
    post:
      tags: [admin-content]
      operationId: unpublishLesson
      summary: Back to draft (keeps its place)
      x-auth: admin
