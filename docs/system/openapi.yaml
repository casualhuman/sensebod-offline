        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ override code (OWNER-4, ADR-017)
  /admin/override/requests:
    post:
      tags: [admin-session]
      operationId: createOverrideRequest
      summary: "Locked out: show a request code to read to EasySTEM"
      x-auth: none
      description: |
        Creates a challenge for `username` and returns the request code the bag shows. Always succeeds for a
        well-formed username, even one that does not exist (no account enumeration; such a challenge can never
        be redeemed). Sets an HttpOnly, SameSite=Strict cookie `sb_ovr` with a 256-bit request secret; every later
        call for this request needs it (V-032). `requestId` is 128 random bits (26 base32 characters). Limits
        (revision 5, V-030): rate limit 3/hour per IP; bag-wide ceiling of 2,000 new network requests per 24 h of
        uptime (then `429` with `details.presenceAvailable: true`); no per-username cap; no bag-wide failure pause.
        With `presence: true` and a live presence token (`POST /admin/override/presence`) plus a USB stick inserted
        within 2 minutes, the request is a presence request exempt from the ceiling and the IP limit. A challenge expires at the first of: 72 h of accumulated bag uptime, 20 boots,
        72 h of wall clock if the clock was trusted at both ends, one successful use, 5 wrong codes, or a
        replacement of the database. `expiresHint` is plain words, not a time. Audited (`admin.override.request`).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                presence: { type: boolean, default: false }
      responses:
        '201':
          description: Request created (and the `sb_ovr` cookie set)
          headers:
            Set-Cookie:
              schema: { type: string }
              description: sb_ovr=<256-bit secret>; HttpOnly; SameSite=Strict; Path=/api/v1/admin/override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverrideRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /admin/override/requests/{requestId}:
    get:
      tags: [admin-session]
      operationId: getOverrideRequest
      summary: State of a request; for the online path also whether a code arrived (needs the request cookie)
      x-auth: request-cookie
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: State
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverrideRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/override/requests/{requestId}/send-online:
    post:
      tags: [admin-session]
      operationId: sendOverrideRequestOnline
      summary: "Online reset (OWNER-3): send the request to EasySTEM's reset service when the bag has internet"
      x-auth: request-cookie
      description: |
        Needs the request cookie `sb_ovr` of the browser that created the request. Only when the bag has an uplink
        and a synchronised clock (needed for TLS). The bag sends `{bag_id, request code, username, requestId}` to
        EasySTEM's reset service, signed with the bag's **Ed25519 sync key** (made on the bag at provisioning; public
        key registered at EasySTEM). The service is store-and-forward: it holds no override master or per-bag secret
        and cannot make codes. EasySTEM staff verify the caller and mint the code on the offline office machine,
        then paste it into the service. The bag polls with signed requests, stores the code (`state: code-received`)
        and acknowledges it; it does **not** redeem by itself: the browser holding the request cookie completes with
        `POST /admin/override/redeem` (no `code` needed). Every step is idempotent by `requestId`. 503 `offline`
        when there is no internet: the person reads the request code to EasySTEM instead. Optional; the offline path
        never depends on it (SYNC §6.3b, V-032).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Sent; poll GET /admin/override/requests/{requestId} (state `waiting-for-easystem` → `code-received`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverrideRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /admin/override/redeem:
    post:
      tags: [admin-session]
      operationId: redeemOverrideCode
      summary: Enter the override code from EasySTEM; on success, set a new password
      x-auth: none
      description: |
        Constant-time comparison; tolerant reading (case, dashes, I/L→1, O→0). Wrong code → 401 `bad_code` with
        `details.attemptsLeft`; 5 wrong codes void the request (no bag-wide pause, V-030). Requires the request
        cookie `sb_ovr` of the browser that created the request (403 `request_not_yours` otherwise; the request is
        untouched). Each wrong attempt is committed before the answer (V-034). Success marks the request used, ends all
        sessions of the account, clears its lockout, and returns a **restricted** session (cookie `sb_admin`,
        15 minutes) that may only call `POST /admin/session/password`; `mustChangePassword` is true. Audited
        (`admin.override.used` / `admin.override.refused`). For an online request whose code was received by the bag
        (`state: code-received`), the same call with `code` omitted completes it (cookie still required).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, username]
              properties:
                requestId: { type: string }
                username: { type: string }
                code: { type: string, minLength: 10, maxLength: 16, example: WB0DE-D5F56 }
      responses:
        '200':
          description: Accepted; restricted session set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '410': { $ref: '#/components/responses/Gone' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/override/presence:
    post:
      tags: [admin-session]
      operationId: startOverridePresence
      summary: "\"I am at the bag\": a 2-minute presence token; plugging any USB stick into the bag in that time proves presence"
      x-auth: none
      description: |
        Sets a short-lived HttpOnly cookie `sb_presence` (2 minutes). Rate limit **3 tokens per hour per IP** (nginx and
        backend; V-038); no bag-wide cap on live tokens, so the person cannot be crowded out. An "insertion" is a USB
        block-device *add* event of any filesystem, recorded with its time by the root helper (`sensebod-offline-usb@`). Every
        browser holding a token that was live at an insertion may create one presence request
        (`POST /admin/override/requests` with `presence: true`), exempt from the 2,000/24 h ceiling (V-030). Audited
        (`admin.override.presence`). Guessing bound: (2,000 + insertions/day × live tokens) × 5 per 24 h of uptime.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204': { description: Token set; plug a USB stick into the bag within 2 minutes }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/override/notices/{noticeId}/ack:
    post:
      tags: [admin-session]
      operationId: acknowledgeOverrideNotice
      summary: A hub manager acknowledges the "override was used" banner (V-031)
      x-auth: hub-manager
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - name: noticeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Acknowledged (audited `admin.override.ack`) }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/learner-data/confirm-date:
    post:
      tags: [admin-exports]
      operationId: confirmDateForRetention
      summary: Confirm that a forward date change is right, so it may count toward automatic removal (V-033)
      x-auth: hub-manager
      description: |
        Only for exported data; unexported data never counts a date jump. Answer to the banner "[n] learners would
        be removed because the date moved forward by [d] days. Is the date right?". Needs a confirm within 5 minutes.
        Audited (`clock.jump.confirmed`).
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jumpId, dateIsRight]
              properties:
                jumpId: { type: string }
                dateIsRight: { type: boolean }
      responses:
        '204': { description: Recorded }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ learner data cleaning (OWNER-5)
  /admin/learner-data/clean:
    post:
      tags: [admin-exports]
      operationId: cleanLearnerData
      summary: Remove learner data now (hub manager)
      x-auth: hub-manager
      description: |
        Removes learners and their progress (`scope: all`, or `older-than` = learners not active for at least
        `days`). Needs a confirm within 5 minutes and `confirm: "CLEAN"`. If any of the selected data has not been
        exported (`GET /admin/learner-data/summary` → `unexportedLearners`), the request also needs
        `acknowledgeUnexported: true` (else 409 `not_exported`), and the screen must show the date of the last
        export first. Deletes with `secure_delete`, writes tombstones, removes local `auto-*` snapshots and takes a
        fresh one. Child protection counts are not personal data and are not touched. Audited (`learner.clean`).
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, confirm]
              properties:
                scope: { type: string, enum: [all, older-than] }
                days: { type: integer, minimum: 1, maximum: 3650 }
                confirm: { type: string, enum: [CLEAN] }
                acknowledgeUnexported: { type: boolean, default: false }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [learnersRemoved, progressRemoved]
                properties:
                  learnersRemoved: { type: integer }
                  progressRemoved: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/exports:
    get:
      tags: [admin-exports]
      operationId: listExports
      summary: Recent exports and backups, newest first
      x-auth: admin
      description: Every admin role sees all kinds (OWNER-6 assumption; roles `hub_manager` and `admin`).
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Exports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportPage' }
        '401': { $ref: '#/components/responses/Unauthorised' }
    post:
      tags: [admin-exports]
      operationId: createExport
      summary: Make a learner-data download, a backup or a diagnostics report
      x-auth: admin
      description: |
        Any admin role (`admin` or `hub_manager`; OWNER-6). The UI's default is `backup-records`, labelled "Export for EasySTEM" (OWNER-5). `includeNames: true` needs a confirm within 5 minutes
        (403 `reauth_required`) and, unless `namesOverWifi: true`, `destination: usb` (422 `names_need_usb`).
        `backup-full` needs `destination: usb` (422). One export preparing per destination (409
        `export_in_progress`). Space is checked first (507 with `details.neededBytes`, `details.availableBytes`).
        The answer is 202 while the worker prepares the file; poll `GET /admin/exports/{id}` every 3 s.
        `password` appears **only** in this first answer. The password is never stored in the database or in
        the idempotency record: a replay with the same `Idempotency-Key` answers the same export with
        `password: null, passwordShown: true`. Power loss while preparing or queued → `interrupted`, never a
        half-written or unencrypted file.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '202':
          description: Preparing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Export'
                  - type: object
                    properties:
                      password:
                        type: string
                        nullable: true
                        description: One-time password of the zip. Only in the first answer; null on a replay.
                        example: river-mango-seven-chalk-42
                      passwordShown:
                        type: boolean
                        description: true on a replay of a request whose first answer carried the password.
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '507': { $ref: '#/components/responses/StorageFull' }
  /admin/exports/{exportId}:
    get:
      tags: [admin-exports]
      operationId: getExport
      summary: One export (state, progress, size, checksum)
      x-auth: admin
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ExportIdPath'
      responses:
        '200':
          description: Export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-exports]
      operationId: deleteExport
      summary: Delete the file from the bag now
      x-auth: admin
      description: Idempotent. The row stays with state `deleted`.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/ExportIdPath'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/exports/{exportId}/download-link:
    post:
      tags: [admin-exports]
      operationId: createExportDownloadLink
      summary: A download link valid 30 minutes
      x-auth: admin
      description: The ticket in the URL works with or without the cookie and for any number of Range requests until it expires.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/ExportIdPath'
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadLink' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /admin/exports/{exportId}/file:
    get:
      tags: [admin-exports]
      operationId: downloadExportFile
      summary: The file itself (Range supported)
      x-auth: admin
      description: |
        The API checks the ticket (or cookie) and hands the file to nginx (`X-Accel-Redirect`), which serves
        `Range`/`If-Range` (206), `ETag`, `Content-Length`. nginx writes no access line for `/api/` and the
        application logs the route template only, so the ticket never reaches a log. Tickets are valid 30 min
        and only within the boot in which they were issued (403 `ticket_invalid` after a restart: ask for a
        new link; the file and ETag are unchanged). 409 `checking` while the file is re-checked after a power
        cut. A request without `Range` or starting at byte 0 is audited as a download.
      security:
        - adminCookie: []
        - downloadTicket: []
      parameters:
        - $ref: '#/components/parameters/ExportIdPath'
        - name: ticket
          in: query
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string, example: bytes=1048576-2097151 }
        - name: If-Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Whole file
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
            ETag: { $ref: '#/components/headers/ETag' }
            Accept-Ranges: { $ref: '#/components/headers/AcceptRanges' }
            X-Sensebod-Offline-SHA256: { $ref: '#/components/headers/Sha256' }
          content:
            application/zip: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '206':
          description: Part of the file
          headers:
            Content-Range:
              schema: { type: string }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Sensebod-Offline-SHA256: { $ref: '#/components/headers/Sha256' }
          content:
            application/zip: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '416': { description: Range not satisfiable }
  /admin/exports/{exportId}/checks:
    post:
      tags: [admin-exports]
      operationId: recordExportCheck
      summary: The admin's page checked the received bytes, or the saved file (SHA-256 matches)
      x-auth: admin
      description: |
        `stage: received` = every byte arrived and the hash of the bytes in the page matched (sets
        `receivedCheckedAt`). `stage: saved` = the admin picked the saved file and its hash matched (sets
        `savedCheckedAt`); only this stage allows the screen to say "Downloaded and checked". Idempotent.
        422 if the hash differs from the file's.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/ExportIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, sha256]
              properties:
                stage: { type: string, enum: [received, saved] }
                sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  # ------------------------------------------------------------------ USB
  /admin/usb:
    get:
      tags: [admin-usb]
      operationId: getUsb
      summary: The USB stick in the bag, if any
      x-auth: admin
      description: Poll every 3 s only while a USB screen is open.
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: USB state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsbState' }
        '401': { $ref: '#/components/responses/Unauthorised' }
  /admin/usb/eject:
    post:
      tags: [admin-usb]
      operationId: ejectUsb
      summary: Remove the stick safely (sync and unmount)
      x-auth: admin
      description: Idempotent. Refused with 409 while a copy to the stick is running.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '200':
          description: State after ejecting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsbState' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/usb/format:
    post:
      tags: [admin-usb]
      operationId: formatUsb
      summary: Format the stick for Sensebod Offline (exFAT, label SENSEBOD-A or SENSEBOD-B)
      x-auth: hub-manager
      description: |
        Deletes everything on the stick. The body must carry `confirm: "FORMAT"`. Needs a confirm (re-auth)
        within 5 minutes. 409 while a USB job runs. Audited (`usb.format`). The API writes a one-time request
        and starts the root unit `sensebod-offline-usb-format@<kernel name>-<nonce>`, which refuses any target that is
        not the USB stick recorded by the mount helper (never the bag's own card; SYSTEM-ARCHITECTURE §9.8).
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, confirm]
              properties:
                label: { type: string, enum: [A, B] }
                confirm: { type: string, enum: [FORMAT] }
      responses:
        '202':
          description: Formatting; follow it in GET /admin/usb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStarted' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/usb/check:
    post:
      tags: [admin-usb]
      operationId: checkUsb
      summary: Re-read every Sensebod Offline file on the stick and compare hashes
      x-auth: hub-manager
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '202':
          description: Started; follow it in GET /admin/status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStarted' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/usb/packages/{packageName}/install:
    post:
      tags: [admin-usb]
      operationId: installUsbPackage
      summary: Install a signed update or content pack from the stick
      x-auth: hub-manager
      description: Refused (409) unless the package's signature is valid. Resumable after power loss.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - name: packageName
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStarted' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '507': { $ref: '#/components/responses/StorageFull' }

  # ------------------------------------------------------------------ system
  /admin/status:
    get:
      tags: [admin-system]
      operationId: getStatus
      summary: Health of the bag (diagnostics screen)
      x-auth: admin
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatus' }
        '401': { $ref: '#/components/responses/Unauthorised' }
  /admin/audit:
    get:
      tags: [admin-system]
      operationId: getAudit
      summary: Who did what and when
      x-auth: hub-manager
      security: [{ adminCookie: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/accounts:
    get:
      tags: [admin-system]
      operationId: listAccounts
      summary: Admin accounts on this bag
      x-auth: hub-manager
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminAccount' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-system]
      operationId: createAccount
      summary: Add an admin (temporary password, must change at first sign-in)
      x-auth: hub-manager
      description: Needs a confirm within 5 minutes (403 `reauth_required`).
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAdminAccount' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/accounts/{accountId}:
    patch:
      tags: [admin-system]
      operationId: updateAccount
      summary: Rename, change role or disable an admin account
      x-auth: hub-manager
      description: |
        Needs a confirm within 5 minutes. Disabling ends that account's sessions at once. The last active
        hub manager cannot be disabled or demoted (409). Passwords are NOT reset here (OWNER-3): a forgotten
        password is reset online (when the bag has internet) or with an EasySTEM override code
        (`/admin/override/*`); a technician CLI remains for physical access.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - name: accountId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAccountPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/clock:
    post:
      tags: [admin-system]
      operationId: setClock
      summary: Set the bag's clock from this phone
      x-auth: hub-manager
      description: |
        409 `conflict` if the difference is under 5 minutes and the clock is trusted (nothing to do). The new time
        is marked `clockTrust: manual`. Every change is audited (`clock.set`, old and new time, who) and listed in
        `GET /admin/status` → `clockChanges`. A manual forward step of more than 7 days is recorded as a clock jump: it
        never counts toward removing unexported learner data, and counts for exported data only after a hub
        manager confirms the date (`/admin/learner-data/confirm-date`; V-033).
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientTime]
              properties:
                clientTime: { type: string, format: date-time }
      responses:
        '200':
          description: Clock set
          content:
            application/json:
              schema:
                type: object
                required: [serverTime, clockTrust]
                properties:
                  serverTime: { type: string, format: date-time }
                  clockTrust: { $ref: '#/components/schemas/ClockTrust' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/power-off:
    post:
      tags: [admin-system]
      operationId: powerOff
      summary: Switch off the bag safely
      x-auth: admin
      description: The bag stops services cleanly and switches off within about 10 s. Refused (409) during an update or restore.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '202': { description: Switching off }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: sb_admin
      description: Random session token set by POST /admin/session. HttpOnly, SameSite=Strict, Path=/. No Secure flag (plain HTTP).
    downloadTicket:
      type: apiKey
      in: query
      name: ticket
      description: HMAC-signed, export-bound, valid 30 minutes. Only for GET /admin/exports/{exportId}/file.

  parameters:
    ClientHeader:
      name: X-Sensebod-Offline-Client
      in: header
      required: true
      description: Must be `1` on every non-GET request (CSRF defence). Missing → 403 `csrf`.
      schema: { type: string, enum: ['1'] }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }
    FileNameHeader:
      name: X-File-Name
      in: header
      required: true
      description: Original file name, URI-encoded. Display and search only.
      schema: { type: string, maxLength: 512 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PortalIdPath:
      name: portalId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PortalId' }
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    SeriesIdPath:
      name: seriesId
      in: path
      required: true
      schema: { type: string }
    LessonIdPath:
      name: lessonId
      in: path
      required: true
      schema: { type: string }
    LearnerIdPath:
      name: learnerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/LearnerId' }
    UploadIdPath:
      name: uploadId
      in: path
      required: true
      schema: { type: string }
    ExportIdPath:
      name: exportId
      in: path
      required: true
      schema: { type: string }

  headers:
    ETag:
      schema: { type: string }
    ContentDisposition:
      schema: { type: string, example: 'attachment; filename="sensebod-offline-learner-data_bag_20261112-1030_ex1.zip"' }
    AcceptRanges:
      schema: { type: string, enum: [bytes] }
    Sha256:
      description: SHA-256 of the whole file, hex.
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    RetryAfter:
      schema: { type: integer, minimum: 1 }

  responses:
    NotModified:
      description: Not modified (ETag matched)
    Unauthorised:
      description: '`unauthorised` (no or expired session) or `bad_credentials`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    Forbidden:
      description: '`forbidden` (role), `csrf`, `ticket_invalid` or `reauth_required`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    NotFound:
      description: '`not_found` — not in this bag (or not published)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    Conflict:
      description: '`conflict`, `not_placed`, `wrong_type`, `export_in_progress`, `offset_mismatch` (details.receivedBytes) or `in_progress` (with Retry-After)'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    Gone:
      description: '`expired` — the export file was removed from the bag'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    PreconditionFailed:
      description: '`precondition_failed` — If-Match version does not match'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    TooLarge:
      description: '`too_large`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    UnsupportedFile:
      description: '`unsupported_file`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    Validation:
      description: '`validation` (with fields) or `idempotency_mismatch`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    RateLimited:
      description: '`rate_limited`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    Unavailable:
      description: '`unavailable` (starting), `busy` (database lock wait exceeded) or `maintenance` (restore/update)'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    StorageFull:
      description: '`storage_full` — details.neededBytes and details.availableBytes when known'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }

  schemas:
    # ---------------- errors, health
    ApiErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation }
            message: { type: string, description: Plain sentence that may be shown as it is. }
            fields:
              type: object
              additionalProperties: { type: string }
            details:
              type: object
              description: Machine values for some codes (receivedBytes, neededBytes, availableBytes).
              additionalProperties: true
    Health:
      type: object
      required: [ok, version, maintenance]
      properties:
        ok: { type: boolean }
        version: { type: string }
        maintenance: { type: boolean }

    # ---------------- enums
    PortalId:
      type: string
      enum: [primary, jss, child-protection, agriculture, climate]
    ThemeName:
      type: string
      enum: [blue, agriculture]
    GroupKind:
      type: string
      enum: [class, audience, topic]
    LessonType:
      type: string
      enum: [watch, listen, read, try, check]
    ProgressState:
      type: string
      enum: [not-started, started, finished]
    Availability:
      type: string
      enum: [available, not-in-bag]
    ContentIconKey:
      type: string
      description: Badge icon key. Unknown keys must be tolerated by the app (fallback to the portal icon).
      example: maths
    AudienceKey:
      type: string
      enum: [child, parent, elder]
    PublishStatus:
      type: string
      enum: [draft, published]
    LessonSource:
      type: string
      enum: [upload, notes-photos, typed, animation, questions, content-pack]
    PictureGroup:
      type: string
      enum: [child-protection, agriculture, climate, school, people-places, own]
    UploadKind:
      type: string
      enum: [video, audio, voice-note, pdf, word, photo, animation, h5p, unknown]
    LearnerRole:
      type: string
      enum: [learner, teacher, other]
    LearnerId:
      type: string
      pattern: '^lr-[a-z2-7]{26}$'
    ClockTrust:
      type: string
      enum: [synced, rtc, restored, manual, unsure]
      description: '`manual` = set by a hub manager from a phone (V-033). A forward step of more than 7 days is recorded as a guarded clock jump only if it is manual or unexplained; steps read from a battery-backed RTC at boot (`rtc`) or made by NTP (`synced`) are real elapsed time (revision 5a).'

    # ---------------- content
    Picture:
      type: object
      required: [url, alt]
      properties:
        url: { type: string, description: Root-relative. }
        alt: { type: string }
    NullablePicture:
      allOf: [{ $ref: '#/components/schemas/Picture' }]
      nullable: true
    PortalRef:
      type: object
      required: [id, title, theme, groupKind]
      properties:
        id: { $ref: '#/components/schemas/PortalId' }
        title: { type: string }
        theme: { $ref: '#/components/schemas/ThemeName' }
        groupKind: { $ref: '#/components/schemas/GroupKind' }
    Portal:
      type: object
      required: [id, title, description, theme, groupKind, picture, listenUrl]
      properties:
        id: { $ref: '#/components/schemas/PortalId' }
        title: { type: string }
        description: { type: string }
        theme: { $ref: '#/components/schemas/ThemeName' }
        groupKind: { $ref: '#/components/schemas/GroupKind' }
        picture: { $ref: '#/components/schemas/NullablePicture' }
        listenUrl: { type: string, nullable: true }
    Group:
      type: object
      required: [id, portalId, kind, title, description, picture, availability, lessonCount, lessonTypes, seriesCount, onlySeriesId, icon, audience, quiz]
      properties:
        id: { type: string }
        portalId: { $ref: '#/components/schemas/PortalId' }
        kind: { $ref: '#/components/schemas/GroupKind' }
        title: { type: string }
        description: { type: string }
        picture: { $ref: '#/components/schemas/NullablePicture' }
        availability: { $ref: '#/components/schemas/Availability' }
        lessonCount: { type: integer, description: Published lessons, quizzes not counted. }
        lessonTypes:
          type: array
          items: { $ref: '#/components/schemas/LessonType' }
        seriesCount: { type: integer }
        onlySeriesId: { type: string, nullable: true }
        icon:
          allOf: [{ $ref: '#/components/schemas/ContentIconKey' }]
          nullable: true
        audience:
          allOf: [{ $ref: '#/components/schemas/AudienceKey' }]
          nullable: true
        quiz:
          allOf: [{ $ref: '#/components/schemas/LessonSummary' }]
          nullable: true
    PortalDetail:
      allOf:
        - $ref: '#/components/schemas/Portal'
        - type: object
          required: [groups]
          properties:
            groups:
              type: array
              items: { $ref: '#/components/schemas/Group' }
    SeriesSummary:
      type: object
      required: [id, portalId, groupId, title, description, picture, availability, lessonCount, hasQuiz, icon, quiz]
      properties:
        id: { type: string }
        portalId: { $ref: '#/components/schemas/PortalId' }
        groupId: { type: string }
        title: { type: string }
        description: { type: string }
        picture: { $ref: '#/components/schemas/NullablePicture' }
        availability: { $ref: '#/components/schemas/Availability' }
        lessonCount: { type: integer }
        hasQuiz: { type: boolean }
        icon:
          allOf: [{ $ref: '#/components/schemas/ContentIconKey' }]
          nullable: true
        quiz:
          allOf: [{ $ref: '#/components/schemas/LessonSummary' }]
          nullable: true
    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [portal, series]
          properties:
            portal: { $ref: '#/components/schemas/PortalRef' }
            series:
              type: array
              items: { $ref: '#/components/schemas/SeriesSummary' }
    LessonTag:
      type: object
      required: [type, interactive, captions, readAlong, needsSound, length, pages]
      properties:
        type: { $ref: '#/components/schemas/LessonType' }
        interactive: { type: boolean }
        captions: { type: boolean }
        readAlong: { type: boolean }
        needsSound: { type: boolean }
        length: { type: integer, nullable: true, description: Seconds. }
        pages: { type: integer, nullable: true }
    LessonSummary:
      allOf:
        - $ref: '#/components/schemas/LessonTag'
        - type: object
          required: [id, seriesId, position, title, summary, picture, language]
          properties:
            id: { type: string }
            seriesId: { type: string }
            position: { type: integer, nullable: true, description: 1-based; null for the Check quiz. }
            title: { type: string }
            summary: { type: string }
            picture: { $ref: '#/components/schemas/NullablePicture' }
            language: { type: string, example: en }
    SeriesDetail:
      allOf:
        - $ref: '#/components/schemas/SeriesSummary'
        - type: object
          required: [portal, group, lessons, listenUrl]
          properties:
            portal: { $ref: '#/components/schemas/PortalRef' }
            group:
              type: object
              required: [id, title, kind, seriesCount]
              properties:
                id: { type: string }
                title: { type: string }
                kind: { $ref: '#/components/schemas/GroupKind' }
                seriesCount: { type: integer }
            lessons:
              type: array
              items: { $ref: '#/components/schemas/LessonSummary' }
            listenUrl: { type: string, nullable: true }
    MediaSource:
      type: object
      required: [url, mimeType]
      properties:
        url: { type: string }
        mimeType: { type: string, example: video/mp4 }
    QuizAnswer:
      type: object
      required: [id, text, correct, feedback]
      properties:
        id: { type: string }
        text: { type: string }
        correct: { type: boolean }
        feedback: { type: string }
    QuizQuestion:
      type: object
      required: [id, prompt, listenUrl, answers, allowRetry]
      properties:
        id: { type: string }
        prompt: { type: string }
        listenUrl: { type: string, nullable: true }
        answers:
          type: array
          items: { $ref: '#/components/schemas/QuizAnswer' }
        allowRetry: { type: boolean }
    VideoQuestion:
      allOf:
        - $ref: '#/components/schemas/QuizQuestion'
        - type: object
          required: [atSeconds, pauseUntilAnswered]
          properties:
            atSeconds: { type: number }
            pauseUntilAnswered: { type: boolean }
    CaptionTrack:
      type: object
      required: [language, label, url]
      properties:
        language: { type: string }
        label: { type: string }
        url: { type: string, description: WebVTT file. }
    TranscriptLine:
      type: object
      required: [start, text]
      properties:
        start: { type: number, nullable: true }
        text: { type: string }
    ReadBlockHeading:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [heading] }
        text: { type: string }
    ReadBlockParagraph:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [paragraph] }
        text: { type: string }
    ReadBlockList:
      type: object
      required: [kind, ordered, items]
      properties:
        kind: { type: string, enum: [list] }
        ordered: { type: boolean }
        items:
          type: array
          items: { type: string }
    ReadBlockPicture:
      type: object
      required: [kind, picture, caption]
      properties:
        kind: { type: string, enum: [picture] }
        picture: { $ref: '#/components/schemas/Picture' }
        caption: { type: string, nullable: true }
    ReadBlock:
      oneOf:
        - $ref: '#/components/schemas/ReadBlockHeading'
        - $ref: '#/components/schemas/ReadBlockParagraph'
        - $ref: '#/components/schemas/ReadBlockList'
        - $ref: '#/components/schemas/ReadBlockPicture'
      discriminator:
        propertyName: kind
        mapping:
          heading: '#/components/schemas/ReadBlockHeading'
          paragraph: '#/components/schemas/ReadBlockParagraph'
          list: '#/components/schemas/ReadBlockList'
          picture: '#/components/schemas/ReadBlockPicture'
    TryItSpot:
      type: object
      required: [id, label, role, says, audioUrl, portrait, x, y, r]
      properties:
        id: { type: string }
        label: { type: string }
        role: { type: string }
        says: { type: string }
        audioUrl: { type: string, nullable: true }
        portrait: { $ref: '#/components/schemas/NullablePicture' }
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        r: { type: number, minimum: 0, maximum: 100 }
    WatchContent:
      type: object
      required: [type, sources, poster, captions, questions, learningPoints]
      properties:
        type: { type: string, enum: [watch] }
        sources:
          type: array
          items: { $ref: '#/components/schemas/MediaSource' }
        poster: { $ref: '#/components/schemas/NullablePicture' }
        captions:
          type: array
          items: { $ref: '#/components/schemas/CaptionTrack' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/VideoQuestion' }
        learningPoints:
          type: array
          items: { type: string }
    ListenContent:
      type: object
      required: [type, sources, cover, transcript]
      properties:
        type: { type: string, enum: [listen] }
        sources:
          type: array
          items: { $ref: '#/components/schemas/MediaSource' }
        cover: { $ref: '#/components/schemas/NullablePicture' }
        transcript:
          type: array
          items: { $ref: '#/components/schemas/TranscriptLine' }
    ReadContent:
      type: object
      required: [type, blocks, pageImages, audio, cover]
      properties:
        type: { type: string, enum: [read] }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ReadBlock' }
        pageImages:
          type: array
          items: { $ref: '#/components/schemas/Picture' }
        audio:
          allOf: [{ $ref: '#/components/schemas/MediaSource' }]
          nullable: true
        cover: { $ref: '#/components/schemas/NullablePicture' }
    TryItContent:
      type: object
      description: 'mode "package": packageUrl is required. mode "hotspots": instruction, scene, spots, goal, finishMessage, gentleMovement are required.'
      required: [type, mode]
      properties:
        type: { type: string, enum: [try] }
        mode: { type: string, enum: [package, hotspots] }
        packageUrl: { type: string, description: index.html of the unpacked package, shown in a sandboxed iframe. }
        instruction: { type: string }
        scene: { $ref: '#/components/schemas/Picture' }
        spots:
          type: array
          items: { $ref: '#/components/schemas/TryItSpot' }
        goal: { type: string, enum: [all, any] }
        finishMessage: { type: string }
        gentleMovement: { type: boolean }
    CheckContent:
      type: object
      required: [type, questions]
      properties:
        type: { type: string, enum: [check] }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
    LessonContent:
      oneOf:
        - $ref: '#/components/schemas/WatchContent'
        - $ref: '#/components/schemas/ListenContent'
        - $ref: '#/components/schemas/ReadContent'
        - $ref: '#/components/schemas/TryItContent'
        - $ref: '#/components/schemas/CheckContent'
      discriminator:
        propertyName: type
        mapping:
          watch: '#/components/schemas/WatchContent'
          listen: '#/components/schemas/ListenContent'
          read: '#/components/schemas/ReadContent'
          try: '#/components/schemas/TryItContent'
          check: '#/components/schemas/CheckContent'
    Lesson:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [portal, group, series, next, listenUrl, content]
          properties:
            portal: { $ref: '#/components/schemas/PortalRef' }
            group:
              type: object
              required: [id, title, kind]
              properties:
                id: { type: string }
                title: { type: string }
                kind: { $ref: '#/components/schemas/GroupKind' }
            series:
              type: object
              required: [id, title, lessonCount]
              properties:
                id: { type: string }
                title: { type: string }
                lessonCount: { type: integer }
            next:
              allOf: [{ $ref: '#/components/schemas/LessonSummary' }]
              nullable: true
            listenUrl: { type: string, nullable: true }
            content: { $ref: '#/components/schemas/LessonContent' }

    # ---------------- learners
    Learner:
      type: object
      required: [id, name, role, roleLabel]
      properties:
        id: { $ref: '#/components/schemas/LearnerId' }
        name: { type: string, minLength: 1, maxLength: 40 }
        role: { $ref: '#/components/schemas/LearnerRole' }
        roleLabel: { type: string }
    NewLearner:
      type: object
      required: [name, role, pin]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: Trimmed by the server. }
        role: { $ref: '#/components/schemas/LearnerRole' }
        pin: { type: string, pattern: '^[0-9]{4}$', description: The learner's secret number. Write-only. }
    LearnerSignIn:
      type: object
      required: [name, pin]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        pin: { type: string, pattern: '^[0-9]{4}$' }
    LessonProgress:
      type: object
      required: [lessonId, seriesId, lessonType, state, positionSeconds, correct, total, updatedAt]
      properties:
        lessonId: { type: string }
        seriesId: { type: string }
        lessonType: { $ref: '#/components/schemas/LessonType' }
        state: { $ref: '#/components/schemas/ProgressState' }
        positionSeconds: { type: integer, nullable: true }
        correct: { type: integer, nullable: true }
        total: { type: integer, nullable: true }
        updatedAt: { type: string, format: date-time }
    SensitiveActivity:
      type: object
      required: [event, viewId]
      properties:
        event: { type: string, enum: [opened, finished] }
        viewId: { type: string, pattern: '^[0-9a-f]{32}$', description: Random per page view. }
    ProgressUpdate:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/ProgressState' }
        positionSeconds: { type: integer, minimum: 0, nullable: true }
        correct: { type: integer, minimum: 0, nullable: true }
        total: { type: integer, minimum: 0, nullable: true }
    LearnerProgress:
      type: object
      required: [learnerId, lessons]
      properties:
        learnerId: { $ref: '#/components/schemas/LearnerId' }
        lessons:
          type: array
          items: { $ref: '#/components/schemas/LessonProgress' }
    ContinueLesson:
      type: object
      required: [lesson, seriesTitle, lessonCount]
      properties:
        lesson: { $ref: '#/components/schemas/LessonSummary' }
        seriesTitle: { type: string }
        lessonCount: { type: integer }

    # ---------------- admin session and accounts
    AdminRole:
      type: string
      enum: [hub_manager, admin]
      description: 'OWNER-6 (assumption, unconfirmed): hub_manager may do everything; admin manages content and exports but cannot clean learner data or manage accounts.'
    AdminSession:
      type: object
      required: [username, displayName, role, mustChangePassword]
      properties:
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/AdminRole' }
        mustChangePassword: { type: boolean }
    AdminCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 32 }
        password: { type: string, minLength: 1, maxLength: 128 }
    AdminAccount:
      type: object
      required: [id, username, displayName, role, isActive, mustChangePassword, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/AdminRole' }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
    NewAdminAccount:
      type: object
      required: [username, displayName, role, temporaryPassword]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        role: { $ref: '#/components/schemas/AdminRole' }
        temporaryPassword: { type: string, minLength: 10, maxLength: 128 }
    AdminAccountPatch:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        role: { $ref: '#/components/schemas/AdminRole' }
        isActive: { type: boolean }

    # ---------------- admin content
    Placement:
      type: object
      required: [portalId, groupId, seriesId, position]
      properties:
        portalId: { $ref: '#/components/schemas/PortalId' }
        groupId: { type: string }
        seriesId: { type: string }
        position: { type: integer, minimum: 1 }
    AdminLesson:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [status, placement, placementLabel, source, fileNames, questionCount, pictureId, updatedAt, notes, version]
          properties:
            status: { $ref: '#/components/schemas/PublishStatus' }
            placement:
              allOf: [{ $ref: '#/components/schemas/Placement' }]
              nullable: true
            placementLabel: { type: string, nullable: true }
            source: { $ref: '#/components/schemas/LessonSource' }
            fileNames:
              type: array
              items: { type: string }
            questionCount: { type: integer, nullable: true }
            pictureId: { type: string, nullable: true }
            updatedAt: { type: string, format: date-time }
            notes:
              type: array
              items: { type: string }
            version: { type: integer, minimum: 1, description: For If-Match on PATCH. }
    LibraryPage:
      type: object
      required: [items, page, pageSize, total, publishedCount, draftCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminLesson' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        publishedCount: { type: integer }
        draftCount: { type: integer }
    PortalCount:
      type: object
      required: [portalId, title, description, lessonCount]
      properties:
        portalId: { $ref: '#/components/schemas/PortalId' }
        title: { type: string }
        description: { type: string }
        lessonCount: { type: integer }
    StorageInfo:
      type: object
      required: [usedBytes, totalBytes, availableBytes, reserveBytes, state, breakdown]
      properties:
        usedBytes: { type: integer, nullable: true }
        totalBytes: { type: integer, nullable: true }
        availableBytes: { type: integer, nullable: true, description: Free for Sensebod Offline (root-reserved blocks excluded). }
        reserveBytes: { type: integer, description: Space kept free; uploads and exports are refused below it. }
        state: { type: string, enum: [ok, low, full] }
        breakdown:
          type: array
          items:
            type: object
            required: [label, bytes]
            properties:
              label: { type: string }
              bytes: { type: integer, nullable: true }
    PackageCheck:
      type: object
      required: [id, ok, title, detail]
      properties:
        id: { type: string, enum: [offline, index, size, player] }
        ok: { type: boolean }
        title: { type: string }
        detail: { type: string }
    Upload:
      type: object
      required: [id, fileName, sizeBytes, receivedBytes, state, kind, becomes, durationSeconds, pages, processing, checks]
      properties:
        id: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer, description: Declared total. }
        receivedBytes: { type: integer }
        state: { type: string, enum: [receiving, processing, ready, failed, abandoned] }
        kind: { $ref: '#/components/schemas/UploadKind' }
        becomes:
          allOf: [{ $ref: '#/components/schemas/LessonType' }]
          nullable: true
        durationSeconds: { type: integer, nullable: true }
        pages: { type: integer, nullable: true }
        processing:
          type: object
          required: [state, note]
          properties:
            state: { type: string, enum: [working, ready, failed] }
            note: { type: string, nullable: true }
        checks:
          type: array
          items: { $ref: '#/components/schemas/PackageCheck' }
    NewResumableUpload:
      type: object
      required: [fileName, sizeBytes, mimeType]
      properties:
        fileName: { type: string, maxLength: 512 }
        sizeBytes: { type: integer, minimum: 1, maximum: 2147483648 }
        mimeType: { type: string }
        smallerCopy: { type: boolean, default: false }
    NewLesson:
      type: object
      required: [source, title]
      properties:
        source: { $ref: '#/components/schemas/LessonSource' }
        title: { type: string, minLength: 1, maxLength: 120 }
        uploadIds:
          type: array
          items: { type: string }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ReadBlock' }
        readAlongUploadId: { type: string }
    LessonPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string }
        placement:
          allOf: [{ $ref: '#/components/schemas/Placement' }]
          nullable: true
        pictureId: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/LessonType' }
        interactive: { type: boolean }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ReadBlock' }
        transcript:
          type: array
          items: { $ref: '#/components/schemas/TranscriptLine' }
    GalleryPicture:
      allOf:
        - $ref: '#/components/schemas/Picture'
        - type: object
          required: [id, group]
          properties:
            id: { type: string }
            group: { $ref: '#/components/schemas/PictureGroup' }
    PicturePage:
      type: object
      required: [suggested, items, page, pageSize, total]
      properties:
        suggested:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/GalleryPicture' }
        items:
          type: array
          items: { $ref: '#/components/schemas/GalleryPicture' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    NewSeries:
      type: object
      required: [portalId, groupId, title]
      properties:
        portalId: { $ref: '#/components/schemas/PortalId' }
        groupId: { type: string }
        title: { type: string, minLength: 1, maxLength: 120 }
    SeriesOrder:
      type: object
      required: [lessonIds]
      properties:
        lessonIds:
          type: array
          items: { type: string }
    AdminSeries:
      allOf:
        - $ref: '#/components/schemas/SeriesSummary'
        - type: object
          required: [lessons]
          properties:
            lessons:
              type: array
              items: { $ref: '#/components/schemas/AdminLesson' }
    QuestionSetItem:
      allOf:
        - $ref: '#/components/schemas/QuizQuestion'
        - type: object
          properties:
            atSeconds: { type: number, minimum: 0 }
            pauseUntilAnswered: { type: boolean }
    QuestionSet:
      type: object
      required: [lessonId, kind, questions]
      properties:
        lessonId: { type: string }
        kind: { type: string, enum: [video, check] }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuestionSetItem' }
    TryItSetupSpot:
      type: object
      required: [id, label, role, says, audioUrl, portrait, x, y, r]
      properties:
        id: { type: string }
        label: { type: string }
        role: { type: string }
        says: { type: string }
        audioUrl: { type: string, nullable: true }
        audioUploadId: { type: string }
        portrait: { $ref: '#/components/schemas/NullablePicture' }
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        r: { type: number, minimum: 0, maximum: 100 }
    TryItSetup:
      type: object
      description: 'mode "package": uploadId, packageUrl, checks. mode "hotspots": instruction, scene or sceneUploadId, spots, goal, finishMessage, gentleMovement.'
      required: [lessonId, mode]
      properties:
        lessonId: { type: string }
        mode: { type: string, enum: [package, hotspots] }
        uploadId: { type: string, nullable: true }
        packageUrl: { type: string, nullable: true }
        checks:
          type: array
          items: { $ref: '#/components/schemas/PackageCheck' }
        instruction: { type: string }
        scene: { $ref: '#/components/schemas/NullablePicture' }
        sceneUploadId: { type: string }
        spots:
          type: array
          items: { $ref: '#/components/schemas/TryItSetupSpot' }
        goal: { type: string, enum: [all, any] }
        finishMessage: { type: string }
        gentleMovement: { type: boolean }

    # ---------------- exports, USB, system
    ExportKind:
      type: string
      enum: [learner-data, backup-records, backup-full, diagnostics]
    ExportRequest:
      type: object
      required: [kind, destination]
      properties:
        kind: { $ref: '#/components/schemas/ExportKind' }
        destination: { type: string, enum: [download, usb] }
        includeNames: { type: boolean, default: false }
        includeChildProtectionCounts: { type: boolean, default: true }
        encrypted: { type: boolean, default: true, description: learner-data only; backups are always encrypted to EasySTEM. }
        namesOverWifi: { type: boolean, default: false, description: 'With includeNames, allow destination download after the warning; audited.' }
        from: { type: string, format: date }
        to: { type: string, format: date }
    Export:
      type: object
      required: [id, kind, destination, state, progress, options, createdAt, createdBy, readyAt, expiresAt, fileName, sizeBytes, sha256, checkCode, rowCounts, errorCode, downloadCount, receivedCheckedAt, savedCheckedAt, clockTrust]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ExportKind' }
        destination: { type: string, enum: [download, usb] }
        state: { type: string, enum: [preparing, ready, checking, copied-to-usb, failed, interrupted, expired, deleted], description: '`checking` = being re-hashed after a power cut; not downloadable yet.' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        options:
          type: object
          required: [includeNames, includeChildProtectionCounts, encrypted]
          properties:
            includeNames: { type: boolean }
            includeChildProtectionCounts: { type: boolean }
            encrypted: { type: boolean }
            namesOverWifi: { type: boolean }
            from: { type: string, format: date, nullable: true }
            to: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: Display name. }
        readyAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        fileName: { type: string, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        sha256: { type: string, nullable: true, pattern: '^[0-9a-f]{64}$' }
        checkCode: { type: string, nullable: true, example: 3F9A 21C0 7B4E }
        rowCounts:
          type: object
          nullable: true
          additionalProperties: { type: integer }
        errorCode:
          type: string
          nullable: true
          enum: [power_or_crash, worker_restart, stalled, password_missing, no_space, usb_removed, usb_full, file_lost, internal, null]
        downloadCount: { type: integer }
        receivedCheckedAt: { type: string, format: date-time, nullable: true }
        savedCheckedAt: { type: string, format: date-time, nullable: true }
        clockTrust: { $ref: '#/components/schemas/ClockTrust' }
    ExportPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Export' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    DownloadLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, example: "/api/v1/admin/exports/ex-abc/file?ticket=..." }
        expiresAt: { type: string, format: date-time }
    LearnerDataSummary:
      type: object
      required: [learners, learnersWithProgress, progressRecords, childProtectionMode, oldestActivity, newestActivity, clockTrust, lastExportAt, lastExportKind, unexportedLearners, retentionDays, nextAutomaticRemoval, retentionHeldBack]
      properties:
        lastExportAt: { type: string, format: date-time, nullable: true, description: 'Last export that reached the admin (saved file checked, or copied to a stick).' }
        lastExportKind: { type: string, nullable: true, enum: [backup-records, backup-full, learner-data, null] }
        unexportedLearners: { type: integer, description: 'Learners with changes newer than the last export (change_seq above its snapshot).' }
        retentionDays: { type: integer, example: 61, description: 'Automatic removal after this many days without activity (OWNER-5: two months).' }
        nextAutomaticRemoval: { type: object, nullable: true, properties: { date: { type: string, format: date }, learners: { type: integer } } }
        clockJumps: { type: array, items: { type: object, properties: { jumpId: { type: string }, days: { type: integer }, at: { type: string, format: date-time }, source: { type: string, enum: [manual, unexplained] }, wouldRemove: { type: integer }, confirmed: { type: boolean } } }, description: 'Unconfirmed forward date jumps > 7 days and how many exported learners each would make removable (V-033).' }
        retentionHeldBack: { type: integer, description: 'Learners past the retention period kept only because they have not been exported (if the owner chooses option B).' }
        learners: { type: integer }
        learnersWithProgress: { type: integer }
        progressRecords: { type: integer }
        childProtectionMode: { type: string, enum: [counts-only, per-learner] }
        oldestActivity: { type: string, format: date, nullable: true }
        newestActivity: { type: string, format: date, nullable: true }
        clockTrust: { $ref: '#/components/schemas/ClockTrust' }
    OverrideRequest:
      type: object
      required: [requestId, requestCode, bagName, state, attemptsLeft, expiresHint]
      properties:
        requestId: { type: string, pattern: '^[0-9a-z]{26}$', description: 128 random bits. }
        requestCode: { type: string, example: 1-Z470-G6F1-3NE0, description: 'Read aloud to EasySTEM: key version, bag tag, 40-bit nonce (Crockford base32).' }
        bagName: { type: string }
        state: { type: string, enum: [open, waiting-for-easystem, code-received, declined, send-failed, used, expired, void] }
        attemptsLeft: { type: integer, minimum: 0, maximum: 5 }
        expiresHint: { type: string, example: 'Valid for about 3 days while the bag is switched on' }
    UsbState:
      type: object
      required: [state, label, filesystem, totalBytes, freeBytes, backups, packages, dirtyNote, repaired, sensebodOfflineLabel, rotationHint]
      properties:
        state: { type: string, enum: [none, mounted, read-only, errors, unreadable, busy, not-answering, ejected] }
        dirtyNote: { type: boolean, description: 'The stick was not removed safely last time (dirty bit only); it is mounted read-write.' }
        repaired: { type: boolean, description: 'The bag repaired this stick (only sticks it formatted itself).' }
        sensebodOfflineLabel: { type: string, nullable: true, enum: [A, B, null], description: 'Set when the bag formatted the stick (SENSEBOD-A / SENSEBOD-B).' }
        rotationHint: { type: string, nullable: true, enum: [A, B, null], description: 'Which stick to use for the next full backup.' }
        label: { type: string, nullable: true }
        filesystem: { type: string, nullable: true, enum: [vfat, exfat, null] }
        totalBytes: { type: integer, nullable: true }
        freeBytes: { type: integer, nullable: true }
        backups:
          type: array
          items:
            type: object
            required: [bagId, bagName, createdAt, scope]
            properties:
              bagId: { type: string }
              bagName: { type: string }
              createdAt: { type: string, format: date-time }
              scope: { type: string, enum: [records, full] }
        packages:
          type: array
          items:
            type: object
            required: [name, kind, version, signatureOk]
            properties:
              name: { type: string }
              kind: { type: string, enum: [update, content-pack] }
              version: { type: string }
              signatureOk: { type: boolean }
    JobStarted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string }
    AdminStatus:
      type: object
      required: [version, uptimeSeconds, bootId, previousShutdownClean, clockTrust, serverTime, storage, database, lastLocalSnapshotAt, lastOffBagBackupAt, recovery, jobs, power, temperatureC, overrideNotices, clockChanges]
      properties:
        overrideNotices: { type: array, description: 'Unacknowledged override uses; shown as a banner to every admin (V-031).', items: { type: object, required: [noticeId, username, usedAt], properties: { noticeId: { type: string }, username: { type: string }, usedAt: { type: string, format: date-time } } } }
        clockChanges: { type: array, description: 'Clock changes of the last 30 days, shown on the status screen (V-033).', items: { type: object, properties: { at: { type: string, format: date-time }, from: { type: string, format: date-time }, to: { type: string, format: date-time }, source: { type: string, enum: [manual, boot, ntp] }, byUsername: { type: string, nullable: true } } } }
        version: { type: string }
        uptimeSeconds: { type: integer }
        bootId: { type: string }
        previousShutdownClean: { type: boolean }
        clockTrust: { $ref: '#/components/schemas/ClockTrust' }
        serverTime: { type: string, format: date-time }
        storage: { $ref: '#/components/schemas/StorageInfo' }
        database:
          type: object
          required: [sizeBytes, walBytes, lastQuickCheck, lastIntegrityCheckAt]
          properties:
            sizeBytes: { type: integer }
            walBytes: { type: integer }
            lastQuickCheck: { type: string, enum: [ok, failed] }
            lastIntegrityCheckAt: { type: string, format: date-time, nullable: true }
        lastLocalSnapshotAt: { type: string, format: date-time, nullable: true }
        lastOffBagBackupAt: { type: string, format: date-time, nullable: true }
        recovery:
          type: object
          required: [restoredFrom, note]
          properties:
            restoredFrom: { type: string, nullable: true }
            note: { type: string, nullable: true }
        jobs:
          type: array
          items:
            type: object
            required: [id, kind, state, progress, errorCode]
            properties:
              id: { type: string }
              kind: { type: string }
              state: { type: string, enum: [queued, running, done, failed, interrupted, cancelled] }
              progress: { type: integer, minimum: 0, maximum: 100 }
              errorCode: { type: string, nullable: true }
        power:
          type: object
          required: [undervoltageSinceBoot, throttledNow]
          properties:
            undervoltageSinceBoot: { type: boolean }
            throttledNow: { type: boolean }
        temperatureC: { type: number, nullable: true }
    AuditEvent:
      type: object
      required: [id, at, clockTrust, actorName, action, targetType, targetId, outcome, detail]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        clockTrust: { $ref: '#/components/schemas/ClockTrust' }
        actorName: { type: string, nullable: true }
        action: { type: string, example: export.create }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        outcome: { type: string, enum: [ok, refused, failed, interrupted] }
        detail:
          type: object
          additionalProperties: true
    AuditPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
