  # ------------------------------------------------------------------ admin uploads
  /admin/uploads:
    post:
      tags: [admin-uploads]
      operationId: uploadContent
      summary: Upload one small file in one request (≤ 16 MiB)
      x-auth: admin
      description: |
        Raw body (not multipart), streamed to disk. Larger files use the resumable protocol
        (`POST /admin/uploads/resumable`). Retrying with the same `Idempotency-Key` returns the first upload.
        Unusable kinds → 415. The file name is for display only; storage names are generated.
        Transition (API-DECISIONS D-6.2b): until the frontend ships resumable uploads, the bag is configured
        (`uploads.single_max_bytes`) to accept single requests up to 2 GiB; the 16 MiB limit applies after that.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/FileNameHeader'
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1, maximum: 16777216 }
        - name: smallerCopy
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          '*/*':
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/Validation' }
        '507': { $ref: '#/components/responses/StorageFull' }
  /admin/uploads/resumable:
    post:
      tags: [admin-uploads]
      operationId: startResumableUpload
      summary: Start a resumable upload (any size up to 2 GiB)
      x-auth: admin
      description: |
        Declares the file; the space check happens here (507). Then send the bytes with
        `PUT /admin/uploads/{id}/bytes` in chunks of `chunkBytes`. After power loss or a Wi-Fi drop,
        `GET /admin/uploads/{id}` tells where to continue.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewResumableUpload' }
      responses:
        '201':
          description: Ready to receive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Upload'
                  - type: object
                    required: [chunkBytes]
                    properties:
                      chunkBytes: { type: integer, example: 2097152, description: 'Recommended chunk size (2 MiB). Smaller chunks hold a server thread for less time on slow Wi-Fi.' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/Validation' }
        '507': { $ref: '#/components/responses/StorageFull' }
  /admin/uploads/{uploadId}:
    get:
      tags: [admin-uploads]
      operationId: getUpload
      summary: Upload state (receivedBytes, processing)
      x-auth: admin
      description: Poll every few seconds while `processing.state` is `working`, not faster.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UploadIdPath'
      responses:
        '200':
          description: Upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-uploads]
      operationId: deleteUpload
      summary: Abandon or remove an upload
      x-auth: admin
      description: Idempotent.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/UploadIdPath'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/uploads/{uploadId}/bytes:
    put:
      tags: [admin-uploads]
      operationId: sendUploadChunk
      summary: Send the next chunk (≤ 4 MiB; 2 MiB recommended)
      x-auth: admin
      description: |
        `Content-Range: bytes <start>-<end>/<total>`; `start` must equal `receivedBytes`, otherwise
        409 `offset_mismatch` with `details.receivedBytes` (resend from there). The chunk is fsynced
        before `receivedBytes` is committed and before 200. Resending an already received range is a
        no-op answered like a mismatch, so retries are safe. On the last chunk the state becomes
        `processing` or `ready`.
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/UploadIdPath'
        - name: Content-Range
          in: header
          required: true
          schema: { type: string, pattern: '^bytes \d+-\d+/\d+$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 4194304 }
      responses:
        '200':
          description: Chunk stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Validation' }
        '507': { $ref: '#/components/responses/StorageFull' }

  # ------------------------------------------------------------------ admin exports
  /admin/learner-data/summary:
    get:
      tags: [admin-exports]
      operationId: getLearnerDataSummary
      summary: Counts shown on the "Download learner data" screen
      x-auth: admin
      security: [{ adminCookie: [] }]
      responses:
        '200':
